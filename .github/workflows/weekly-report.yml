name: Weekly Agent-0 Status Report

on:
  schedule:
    # Every Monday at 07:30 UTC — runs after Dependabot, before standup
    - cron: "30 7 * * 1"
  workflow_dispatch:

jobs:
  weekly-report:
    name: Create Weekly Status Issue
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (snapshot for report)
        run: npm test -- --reporter=verbose 2>&1 | tee /tmp/test-output.txt || true

      - name: Typecheck (snapshot for report)
        run: npx tsc --noEmit 2>&1 | tee /tmp/tsc-output.txt || true

      - name: Create weekly status issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const now = new Date().toISOString().slice(0, 10);
            const testOutput = fs.existsSync("/tmp/test-output.txt")
              ? fs.readFileSync("/tmp/test-output.txt", "utf8").slice(-2000)
              : "unavailable";
            const tscOutput = fs.existsSync("/tmp/tsc-output.txt")
              ? fs.readFileSync("/tmp/tsc-output.txt", "utf8").slice(-500) || "✅ No errors"
              : "unavailable";

            const body = [
              "## 📋 Agent 0 — Weekly Status Report",
              `**Week of:** ${now}`,
              "",
              "### Agent 1 – Engineering",
              "- [ ] CI passing on `main`",
              "- [ ] No open HIGH/CRITICAL CodeQL alerts",
              "- [ ] Dependabot PRs reviewed",
              "",
              "### Agent 2 – Growth",
              "- [ ] i18n coverage ≥ 75% for all languages",
              "- [ ] KPI targets on track (check Investor Portal)",
              "- [ ] Pending translation PRs reviewed",
              "",
              "### Agent 3 – Operations",
              "- [ ] Network uptime ≥ 98.5%",
              "- [ ] No critical alerts unresolved > 24h",
              "- [ ] Maintenance schedule on track",
              "",
              "### Agent 4 – Business Development",
              "- [ ] Pipeline value updated",
              "- [ ] New clinic/partner leads qualified",
              "- [ ] Pending contracts reviewed",
              "",
              "### Agent 5 – Finance & Legal",
              "- [ ] Monthly KPI report on track",
              "- [ ] No open compliance items",
              "- [ ] Commission payments accurate",
              "",
              "### Test Suite Snapshot",
              "```",
              testOutput,
              "```",
              "",
              "### TypeScript Snapshot",
              "```",
              tscOutput,
              "```",
              "",
              "---",
              "*Auto-generated by Agent 0 weekly-report workflow. Close when reviewed.*",
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Agent 0] Weekly Status Report – ${now}`,
              body,
              labels: ["agent-0-orchestrator", "weekly-report"],
            });
